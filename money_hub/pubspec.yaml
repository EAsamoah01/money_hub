name: money_hub
description: All-in-one personal finance app — budgeting, debt payoff, net worth, calculators and lessons.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation & deep links
  go_router: ^14.6.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (shared by every module)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5

  # Charts, sharing, links
  fl_chart: ^0.69.0
  share_plus: ^10.1.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.0

  # Notifications, security
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0

  # Monetization
  purchases_flutter: ^10.16.0 # RevenueCat subscriptions (iOS, Android, macOS, web)
  http: ^1.2.2 # downloads live affiliate offers
  timezone: ^0.10.0 # scheduling bill reminders

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.4 # dart run flutter_launcher_icons
  flutter_native_splash: ^2.4.8 # dart run flutter_native_splash:create

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/
    - assets/config/
    - assets/branding/icon.png # lock screen logo

# ── App icon: run `dart run flutter_launcher_icons` after changing these ──
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256

# ── Splash screen: run `dart run flutter_native_splash:create` after changing ──
flutter_native_splash:
  color: "#0F766E"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#0F766E"
    image: assets/branding/splash_android12.png
  web: false

name: money_hub
description: All-in-one personal finance app — budgeting, debt payoff, net worth, calculators and lessons.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation & deep links
  go_router: ^14.6.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (shared by every module)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5

  # Charts, sharing, links
  fl_chart: ^0.69.0
  share_plus: ^10.1.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.0

  # Notifications, security
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0

  # Monetization
  purchases_flutter: ^10.16.0 # RevenueCat subscriptions (iOS, Android, macOS, web)
  http: ^1.2.2 # downloads live affiliate offers

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/
    - assets/config/

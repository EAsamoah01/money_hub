# Money Core AI proxy — a Cloudflare Worker that sits between the app and
# Claude. The app never sees the Anthropic key. Deploy steps: see ../AI.md
name = "money-core-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Custom domain: attached in the Cloudflare dashboard (see ../AI.md):
#   https://moneycore.peprahsoft.com

[vars]
MODEL = "claude-haiku-5-5"
PRO_ENTITLEMENT = "pro"
# Most AI requests one Pro user can make per day (protects your bill).
DAILY_LIMIT = "100"

# Shown on the /privacy and /terms pages. Fill these in before launch.
DEVELOPER_NAME = "Peprah Tech"
CONTACT_EMAIL = "starlinkks@gmail.com"
EFFECTIVE_DATE = "October 26, 2026"
GOVERNING_LAW = "the State of California, USA"

# Daily usage counter. Create it once with:
#   npx wrangler kv namespace create USAGE
# then paste the id it prints below.
[[kv_namespaces]]
binding = "USAGE"
id = "1517fe8b3de74c52a6955fc0d17e9f0a"

# Secrets (never put these in this file). Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY
#   npx wrangler secret put DEV_TOKEN        (optional, for testing without a subscription)
